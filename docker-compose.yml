version: '3.8'
services:
  backend:
    build:
      context: ./VenueBackend
    ports:
      - "8000:8000"
    env_file:
      - ./VenueBackend/.env

  frontend:
    build:
      context: ./VenueFrontend       
      dockerfile: dockerfile 
    ports:
      - "4200:80"
    depends_on:
      - backend
