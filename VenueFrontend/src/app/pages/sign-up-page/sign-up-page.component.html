<div class="w-full h-screen font-[Manrope] bg-tertiary-dark flex items-center justify-center relative">
  <div class="fg rounded-2xl shadow-2xl p-8 w-[28rem]">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Join Showfari</h2>
    <p class="text-sm text-gray-500 mb-6">Create your account and start exploring the scene.</p>

    <form class="space-y-4">
      <div>
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="name"
          name="fullName"
          placeholder="Your name"
        />
      </div>

      <div>
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Your@email.com"
        />
      </div>

      <div>
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Your password"
        />
      </div>

      <button
        class="w-full"
        type="submit">
        Sign Up
      </button>
    </form>
  </div>
</div>
