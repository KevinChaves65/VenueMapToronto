<div class="w-full h-screen font-[Manrope] bg-tertiary-dark flex items-center justify-center relative">
  <div class="bg-white rounded-2xl shadow-2xl outline-2 outline-primary p-8 w-[28rem]">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Welcome back!</h2>
    <p class="text-sm text-gray-500 mb-6">Sign in to continue your journey.</p>

    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full border border-gray-300 rounded-md p-2"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full border border-gray-300 rounded-md p-2"
          placeholder="••••••••"
        />
      </div>

      <button
        class="w-full bg-[color:var(--color-primary)] hover:bg-[color:var(--color-primary-dark)] text-white font-semibold py-2 px-4 rounded-md"
        type="submit">
        Sign In
      </button>
    </form>
  </div>
</div>
