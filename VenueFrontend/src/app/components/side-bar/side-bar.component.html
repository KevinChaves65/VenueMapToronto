<div class="sidebar-container" [ngClass]="{ 'collapsed': isCollapsed }">
  <button
    mat-icon-button
    class="collapse-button icon"
    [ngClass]="{ 'collapsed-position': isCollapsed }"
    (click)="toggleSidebar()"
    aria-label="Toggle Sidebar">
    <mat-icon>{{ isCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
  </button>
  <div *ngIf="!isCollapsed">
  <div class="sidebar-header">
    <div class="sidebar-title">
    <h2>Toronto Shows</h2>
  </div>
  <div class="view-toggle-buttons">
  <button class="medium secondary"
    mat-button
    [ngClass]="{ 'active': viewMode === 'venues' }"
    (click)="setView('venues')">
    Venues
  </button>
  <button class="medium secondary"
    mat-button
    [ngClass]="{ 'active': viewMode === 'events' }"
    (click)="setView('events')">
    Events
  </button>
  <button class="medium secondary"
    mat-button
    [ngClass]="{ 'active': viewMode === 'artists' }"
    (click)="setView('artists')">
    Artists
  </button>
</div>
</div>
<div *ngIf="viewMode === 'venues'" class="venue-list">
  <app-venue-card
    *ngFor="let venue of venues"
    [venue]="venue"
    (eventSelected)="handleEventSelected($event)">
  </app-venue-card>
</div>

<div *ngIf="viewMode === 'events'" class="event-list-wrapper">
  <app-event-list (eventSelected)="handleEventSelected($event)"></app-event-list>
</div>

<div *ngIf="viewMode === 'artists'" class="artist-list">
  <app-artist-list></app-artist-list>
</div>
</div>
</div>
<app-event-card
  *ngIf="selectedEvent"
  [event]="selectedEvent"
  [close]="closeSelectedEvent">
</app-event-card>
