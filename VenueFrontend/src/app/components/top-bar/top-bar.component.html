<!-- Top Bar: Fixed Position + Icons Only -->
<div class="fixed top-4 right-4 z-50 flex items-center gap-3 fg p-2 rounded-xl shadow-lg">
  <button (click)="togglePanel('about')" aria-label="About" class="icon accent rounded-full">
    <mat-icon>contact_page</mat-icon>
  </button>
  <button (click)="togglePanel('settings')" aria-label="Settings" class="icon accent rounded-full">
    <mat-icon>settings</mat-icon>
  </button>
  <button (click)="togglePanel('account')" aria-label="Account" class="icon accent rounded-full">
    <mat-icon>person</mat-icon>
  </button>
</div>

<!-- Panel: Overlay Centered Modal -->
<div *ngIf="activePanel" class="fixed inset-0 z-40 flex items-center justify-center bg-black/50 backdrop-blur-sm">
  <div
    class="relative w-full max-w-6xl max-h-[90vh] overflow-y-auto bg-tertiary-dark rounded-xl p-6 shadow-2xl text-white"
    (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button
      (click)="closePanel()"
      class="absolute top-4 right-4 small rounded-full bg-transparent"
    >
    <mat-icon>close</mat-icon>
    </button>

    <!-- Panel Content -->
    <ng-container [ngSwitch]="activePanel">
      <app-about-page *ngSwitchCase="'about'"></app-about-page>
      <app-settings *ngSwitchCase="'settings'"></app-settings>
      <app-profile *ngSwitchCase="'account'"></app-profile>
    </ng-container>
  </div>
</div>
